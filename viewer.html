<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ARA — Experiencia AR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --bg2: #111111;
      --red: #e63329;
      --red2: #ff5a4d;
      --fd: "Montserrat", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: #fff; font-family: var(--fd); height: 100vh; overflow: hidden; touch-action: none; }

    #startScreen,
    #splash,
    #errBox {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
    }

    #startScreen {
      background: var(--bg);
      gap: 20px;
      z-index: 2000;
    }
    #startScreen.hidden { display: none; }

    .start-mark,
    .splash-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 900;
      background: linear-gradient(135deg, var(--red), var(--red2));
    }

    .start-mark {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      font-size: 28px;
      box-shadow: 0 8px 24px rgba(230, 51, 41, 0.4);
    }

    .start-logo { font-size: 42px; font-weight: 900; letter-spacing: -0.03em; }
    .start-name { font-size: 18px; font-weight: 700; opacity: 0.9; }
    .start-hint { font-size: 12px; opacity: 0.5; letter-spacing: 0.05em; }

    .start-btn {
      background: linear-gradient(135deg, var(--red), var(--red2));
      color: #fff;
      border: none;
      padding: 16px 40px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 999px;
      font-family: var(--fd);
      box-shadow: 0 4px 20px rgba(230, 51, 41, 0.4);
    }

    #splash {
      background: var(--bg);
      gap: 16px;
      z-index: 1900;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #splash.visible { opacity: 1; pointer-events: all; }

    .splash-mark {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      font-size: 22px;
    }

    .splash-msg { font-size: 13px; opacity: 0.6; letter-spacing: 0.06em; }

    #hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #hud.show { opacity: 1; pointer-events: all; }

    .hud-logo,
    .hud-close,
    #scan {
      background: rgba(10, 10, 10, 0.82);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .hud-logo {
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 900;
      color: var(--red);
      letter-spacing: 0.08em;
    }

    .hud-close {
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      letter-spacing: 0.06em;
    }

    #scan {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 24px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #scan.show { opacity: 1; }

    #arScene { position: fixed; inset: 0; display: none; z-index: 500; }
    #arScene.show { display: block; }

    #errBox {
      background: var(--bg);
      gap: 16px;
      z-index: 3000;
      display: none;
    }
    #errBox.show { display: flex; }

    .err-icon { font-size: 40px; opacity: 0.4; }
    .err-msg { font-size: 14px; opacity: 0.7; line-height: 1.6; max-width: 320px; }
  </style>
</head>
<body>
  <div id="startScreen">
    <div class="start-mark">◆</div>
    <div class="start-logo">ARA</div>
    <div class="start-name" id="startName"></div>
    <div class="start-hint">Apunta la cámara al trigger para activar el contenido</div>
    <button class="start-btn" onclick="arrancarExperiencia()">◆ Iniciar AR</button>
  </div>

  <div id="splash">
    <div class="splash-mark">◆</div>
    <div class="splash-msg" id="splashMsg">Cargando...</div>
  </div>

  <div id="hud">
    <div class="hud-logo">ARA</div>
    <div class="hud-close" onclick="cerrarViewer()">✕ Cerrar</div>
  </div>

  <div id="scan" class="show">Apunta a la obra</div>

  <div id="arScene"></div>

  <div id="errBox">
    <div class="err-icon">⚠</div>
    <div class="err-msg" id="errMsg"></div>
  </div>

  <script>
    const P = new URLSearchParams(location.search);
    const PROJECT = P.get("p") || P.get("slug") || P.get("project");
    const BASE = "https://sergeam09.github.io/ara";
    const WORKER = "https://ara.sergeam09.workers.dev";
    const PATHS = {
      mind: `${BASE}/proyectos/${PROJECT}/trigger.mind`,
      config: `${BASE}/proyectos/${PROJECT}/config.json`
    };

    let CFG = {};
    let CAPAS = [];

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    const setSplash = (msg) => {
      document.getElementById("splashMsg").textContent = msg;
    };

    const showSplash = () => {
      document.getElementById("splash").classList.add("visible");
    };

    const hideSplash = () => {
      document.getElementById("splash").classList.remove("visible");
    };

    const showErr = (msg) => {
      hideSplash();
      document.getElementById("errMsg").innerHTML = msg;
      document.getElementById("errBox").classList.add("show");
    };

    document.getElementById("startName").textContent = PROJECT
      ? PROJECT.replace(/-/g, " ").toUpperCase()
      : "";

    if (!PROJECT) {
      showErr("No se especificó ningún proyecto.<br>Verifica el link.");
    }

    function arrancarExperiencia() {
      document.getElementById("startScreen").classList.add("hidden");
      showSplash();
      setSplash("Cargando configuración...");
      loadConfig();
    }

    async function loadConfig() {
      try {
        const r1 = await fetch(`${WORKER}?config=${PROJECT}&v=${Date.now()}`);
        if (r1.ok) {
          const d = await r1.json();
          if (!d.error) {
            processConfig(d);
            return;
          }
        }
      } catch (_err) {}

      try {
        const r2 = await fetch(`${PATHS.config}?t=${Date.now()}`);
        if (r2.ok) {
          processConfig(await r2.json());
          return;
        }
      } catch (_err) {}

      showErr("No se pudo cargar el proyecto.<br>Verifica que exista y esté publicado.");
    }

    function processConfig(saved) {
      CFG = saved || {};
      CAPAS = Array.isArray(saved?.capas) ? saved.capas : [];
      setSplash("Iniciando cámara...");
      buildScene();
    }

    AFRAME.registerComponent("render-order", {
      schema: { value: { type: "number", default: 0 } },
      init() {
        this.el.addEventListener("object3dset", () => this.apply());
        this.apply();
      },
      apply() {
        this.el.object3D.traverse((node) => {
          if (!node.isMesh) {
            return;
          }
          node.renderOrder = this.data.value;
          if (node.material) {
            node.material.transparent = true;
            node.material.depthWrite = false;
            node.material.alphaTest = Math.max(node.material.alphaTest || 0, 0.01);
            node.material.side = THREE.DoubleSide;
            node.material.needsUpdate = true;
          }
        });
      }
    });

    AFRAME.registerComponent("mindar-pose-smoothing", {
      schema: {
        positionLerp: { type: "number", default: 0.22 },
        quaternionLerp: { type: "number", default: 0.18 },
        scaleLerp: { type: "number", default: 0.22 }
      },
      init() {
        this.started = false;
        this.smoothPosition = new THREE.Vector3();
        this.smoothQuaternion = new THREE.Quaternion();
        this.smoothScale = new THREE.Vector3(1, 1, 1);
      },
      tick() {
        const obj = this.el.object3D;
        if (!obj.visible) {
          this.started = false;
          return;
        }

        if (!this.started) {
          this.smoothPosition.copy(obj.position);
          this.smoothQuaternion.copy(obj.quaternion);
          this.smoothScale.copy(obj.scale);
          this.started = true;
          return;
        }

        this.smoothPosition.lerp(obj.position, this.data.positionLerp);
        this.smoothQuaternion.slerp(obj.quaternion, this.data.quaternionLerp);
        this.smoothScale.lerp(obj.scale, this.data.scaleLerp);

        obj.position.copy(this.smoothPosition);
        obj.quaternion.copy(this.smoothQuaternion);
        obj.scale.copy(this.smoothScale);
      }
    });

    function escapeAttr(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function normalizeDepth(depthCm, targetWidthCm) {
      if (!depthCm) {
        return 0;
      }

      const width = Math.max(parseFloat(targetWidthCm) || 20, 0.001);
      return depthCm / width;
    }

    function buildVideoAsset(capa, index) {
      const ext = capa.archivo.split(".").pop().toLowerCase();
      const src = `${BASE}/proyectos/${PROJECT}/${capa.archivo}`;
      const base = capa.archivo.slice(0, capa.archivo.lastIndexOf("."));
      const muted = capa.audio ? "" : "muted";
      const loop = capa.loop !== false ? "loop" : "";

      if (!["mp4", "webm", "mov"].includes(ext)) {
        return "";
      }

      if (ext === "webm") {
        return isIOS
          ? `<video id="v${index}" playsinline webkit-playsinline ${muted} crossorigin="anonymous" preload="auto" ${loop}>
               <source src="${BASE}/proyectos/${PROJECT}/${base}.mov" type="video/quicktime">
             </video>`
          : `<video id="v${index}" playsinline webkit-playsinline ${muted} crossorigin="anonymous" preload="auto" ${loop}>
               <source src="${src}" type="video/webm">
             </video>`;
      }

      if (ext === "mov") {
        return isIOS
          ? `<video id="v${index}" playsinline webkit-playsinline ${muted} crossorigin="anonymous" preload="auto" ${loop}>
               <source src="${src}" type="video/quicktime">
             </video>`
          : `<video id="v${index}" playsinline webkit-playsinline ${muted} crossorigin="anonymous" preload="auto" ${loop}>
               <source src="${BASE}/proyectos/${PROJECT}/${base}.webm" type="video/webm">
             </video>`;
      }

      return `<video id="v${index}" src="${src}" playsinline webkit-playsinline ${muted} crossorigin="anonymous" preload="auto" ${loop}></video>`;
    }

    function buildScene() {
      const targetWidthCm = parseFloat(CFG.anchoReal) || 20;
      const targetHeightCm = parseFloat(CFG.altoReal) || 20;
      const ratio = targetWidthCm / targetHeightCm;
      const planeWidth = 1;
      const planeHeight = 1 / ratio;

      const assets = CAPAS
        .map((capa, index) => {
          if (!capa.archivo) {
            return "";
          }

          const ext = capa.archivo.split(".").pop().toLowerCase();
          return ["mp4", "webm", "mov"].includes(ext) ? buildVideoAsset(capa, index) : "";
        })
        .join("");

      const entities = CAPAS.map((capa, index) => {
        if (!capa.archivo && capa.tipo !== "texto" && capa.tipo !== "text") {
          return "";
        }

        const px = parseFloat(capa.posX) || 0;
        const py = parseFloat(capa.posY) || 0;
        const depthUnits = normalizeDepth(parseFloat(capa.posZ) || 0, targetWidthCm);
        const pz = (-depthUnits - index * 0.002).toFixed(4);
        const pos = `${px.toFixed(4)} ${py.toFixed(4)} ${pz}`;
        const scale = parseFloat(capa.escala) || 1;
        const opacity = capa.opacidad !== undefined ? capa.opacidad : 1;
        const source = capa.archivo ? `${BASE}/proyectos/${PROJECT}/${capa.archivo}` : "";
        const ext = capa.archivo ? capa.archivo.split(".").pop().toLowerCase() : "";
        const scl = `${scale} ${scale} ${scale}`;
        const order = 100 + index;

        let anim = "";
        if (capa.entrada === "fade") {
          anim = `animation__in="property:material.opacity;from:0;to:${opacity};dur:800;startEvents:targetFound"`;
        }
        if (capa.entrada === "scale") {
          anim = `animation__in="property:scale;from:0 0 0;to:${scale} ${scale} ${scale};dur:600;startEvents:targetFound"`;
        }

        switch (capa.tipo) {
          case "video": {
            if (!["mp4", "webm", "mov"].includes(ext)) {
              return "";
            }

            const isAlphaVideo = ext === "webm" || ext === "mov";
            const material = isAlphaVideo
              ? `material="src:#v${index};shader:flat;transparent:true;alphaTest:0.01;opacity:${opacity};depthWrite:false;side:double"`
              : `material="src:#v${index};shader:flat;transparent:true;opacity:${opacity};depthWrite:false;side:double"`;

            return `<a-plane id="arc${index}" width="${planeWidth}" height="${planeHeight.toFixed(4)}" position="${pos}" scale="${scl}" ${material} render-order="value:${order}" ${anim}></a-plane>`;
          }

          case "image":
          case "gif": {
            const hasAlpha = ["png", "webp", "apng"].includes(ext);
            const material = hasAlpha
              ? `material="src:${source};transparent:true;alphaTest:0.01;opacity:${opacity};depthWrite:false;side:double"`
              : `material="src:${source};transparent:true;opacity:${opacity};depthWrite:false;side:double"`;

            return `<a-image id="arc${index}" src="${source}" width="${planeWidth}" height="${planeHeight.toFixed(4)}" position="${pos}" scale="${scl}" ${material} render-order="value:${order}" ${anim}></a-image>`;
          }

          case "svg":
            return `<a-image id="arc${index}" src="${source}" width="${planeWidth}" height="${planeHeight.toFixed(4)}" position="${pos}" scale="${scl}" material="src:${source};transparent:true;alphaTest:0.01;opacity:${opacity};depthWrite:false;side:double" render-order="value:${order}" ${anim}></a-image>`;

          case "glb":
          case "gltf":
          case "model":
            return `<a-gltf-model id="arc${index}" src="${source}" position="${pos}" scale="${scl}" render-order="value:${order}" ${anim}></a-gltf-model>`;

          case "texto":
          case "text": {
            const txt = escapeAttr(capa.texto || "Texto");
            const color = capa.colorTexto || "#ffffff";
            const size = parseFloat(capa.tamanoTexto) || 0.2;
            const width = Math.max(0.3, size * 5);
            return `<a-text id="arc${index}" value="${txt}" color="${color}" align="center" width="${width}" position="${pos}" scale="${scl}" material="opacity:${opacity};transparent:true;depthWrite:false" render-order="value:${order}" ${anim}></a-text>`;
          }

          default:
            return "";
        }
      }).join("");

      const div = document.getElementById("arScene");
      div.innerHTML = `
        <a-scene
          mindar-image="imageTargetSrc:${PATHS.mind};autoStart:true;uiScanning:false;uiLoading:false;missTolerance:8;warmupTolerance:5;filterMinCF:0.0005;filterBeta:0.01;"
          color-space="sRGB"
          embedded
          renderer="alpha:true;colorManagement:true;physicallyCorrectLights:false;sortObjects:true"
          vr-mode-ui="enabled:false"
          device-orientation-permission-ui="enabled:false"
          style="width:100vw;height:100vh;"
        >
          <a-assets timeout="30000">${assets}</a-assets>
          <a-light type="ambient" intensity="1.15"></a-light>
          <a-light type="directional" intensity="0.65" position="1 2 2"></a-light>
          <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
          <a-entity id="target" mindar-image-target="targetIndex:0" mindar-pose-smoothing>
            <a-entity id="contentRoot">
              ${entities}
            </a-entity>
          </a-entity>
        </a-scene>
      `;

      div.classList.add("show");
      document.getElementById("hud").classList.add("show");
      document.getElementById("scan").classList.add("show");

      window.setTimeout(() => {
        const scene = div.querySelector("a-scene");
        if (!scene) {
          showErr("Error al iniciar la escena AR.");
          return;
        }

        scene.addEventListener("loaded", () => hideSplash());
        scene.addEventListener("arReady", () => hideSplash());
        scene.addEventListener("arError", () => showErr("No se pudo acceder a la cámara.<br>Verifica los permisos."));

        const target = scene.querySelector("[mindar-image-target]");
        if (!target) {
          return;
        }

        target.addEventListener("targetFound", () => {
          document.getElementById("scan").classList.remove("show");
          scene.querySelectorAll("video").forEach((video) => {
            const playPromise = video.play();
            if (playPromise) {
              playPromise.catch(() => {
                video.muted = true;
                video.play().catch(() => {});
              });
            }
          });
        });

        target.addEventListener("targetLost", () => {
          document.getElementById("scan").classList.add("show");
          scene.querySelectorAll("video").forEach((video) => {
            try {
              video.pause();
            } catch (_err) {}
          });
        });

        window.setTimeout(() => hideSplash(), 12000);
      }, 500);
    }

    function cerrarViewer() {
      try {
        const scene = document.querySelector("a-scene");
        if (scene?.renderer) {
          scene.renderer.setAnimationLoop(null);
        }
      } catch (_err) {}

      document.getElementById("arScene").classList.remove("show");
      document.getElementById("arScene").innerHTML = "";
      document.getElementById("hud").classList.remove("show");
      document.getElementById("scan").classList.remove("show");
      document.getElementById("startScreen").classList.remove("hidden");
    }
  </script>
</body>
</html>
